name: Build

on:
  push:
    branches:
      - main
      - "mc/**"
    paths-ignore:
      - "**.md"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: witching-gadgets-reforged

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: witching-gadgets-reforged

      - name: Checkout Thaumcraft
        uses: actions/checkout@v5
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: ${{ startsWith(github.ref_name, 'mc/') && github.ref_name || 'main' }}
          path: thaumcraft-4-reforged

      - name: Read versions
        id: props
        run: |
          echo "java=$(grep '^java_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Check seams
        run: python3 tools/check_seams.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.props.outputs.mc }}
          VERSION: ${{ steps.props.outputs.version }}
        run: |
          tag="mc-$MC"
          jar="build/libs/witching-gadgets-reforged-$VERSION-$MC.jar"
          test -f "$jar"
          notes="$(git log -1 --format='%h: %s')"
          latest=false
          if [ "$GITHUB_REF_NAME" = "main" ]; then latest=true; fi
          for old in "$MC" "$VERSION-$MC" "nightly-$MC"; do
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$old\") | .id"); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            git push origin ":refs/tags/$old" || true
          done
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Minecraft $MC" --notes "$notes" --latest="$latest"
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ "$asset" != "$(basename "$jar")" ]; then gh release delete-asset "$tag" "$asset" --yes; fi
            done
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" --latest="$latest" --verify-tag --title "Minecraft $MC" --notes "$notes"
          fi
